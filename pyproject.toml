[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cctv_analytics.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests", "incidents", "platform_core"]
addopts = "--strict-markers --disable-warnings --reuse-db -p no:cacheprovider --cov=incidents --cov=platform_core --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["incidents/migrations", "data", "backups"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["incidents/migrations"]

[tool.django-stubs]
django_settings_module = "cctv_analytics.settings.test"

[tool.coverage.run]
branch = true
data_file = "/tmp/.coverage"
omit = ["*/migrations/*", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
