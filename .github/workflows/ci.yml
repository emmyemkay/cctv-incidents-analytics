name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cctv_test
          POSTGRES_USER: cctv
          POSTGRES_PASSWORD: cctv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cctv -d cctv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: cctv_analytics.settings.test
      DJANGO_SECRET_KEY: ci-test-secret
      INGEST_API_TOKEN: test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/validate_project.py
      - run: python -m compileall -q cctv_analytics platform_core incidents scripts
      - run: for file in incidents/static/incidents/js/*.js; do node --check "$file"; done
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: pytest
      - run: bandit -r cctv_analytics platform_core incidents -x incidents/migrations -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config >/dev/null
      - run: docker compose config --profiles | grep -q monitoring
      - run: docker compose --profile edge --profile scheduled --profile storage --profile mail --profile db-tools --profile monitoring config >/dev/null
      - run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config >/dev/null

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: development
          push: false
          tags: cctv-incident-intelligence:development-ci
          cache-from: type=gha,scope=development
          cache-to: type=gha,mode=max,scope=development
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: cctv-incident-intelligence:runtime-ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
